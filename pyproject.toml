[project]
name = "symplify"
version = "0.10.0"
description = "A modern symbolic calculator built with SymPy and PySide6 (QML)."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    # Capped at the minor we ship and measure: the Qt prune list in
    # scripts/build_windows.py is a whitelist, and a new Qt minor can add or
    # rename DLLs it would silently delete. RinUI and qmlmathplot are capped
    # because this app patches them (WinEventManager, init_config, save_config)
    # and their 0.x minors break (0.4 -> 0.5 rewrote the bootstrap).
    "pyside6>=6.12,<6.13",
    "rinui>=0.5.0,<0.6",
    "pyyaml>=6.0.3",
    "sympy>=1.14.0",
    "ziamath>=0.13",
    "fonttools>=4.0",
    "qmlmathplot[calc]>=0.7.0,<0.8",
]

[dependency-groups]
dev = [
    "nuitka>=4.2.2",
    "ruff>=0.17.1",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
