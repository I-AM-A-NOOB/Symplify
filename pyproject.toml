[project]
name = "symplify"
version = "0.8.0"
description = "A modern symbolic calculator built with SymPy and PySide6 (QML)."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "pyside6>=6.7.0",
    "rinui>=0.4.4.1",
    "pyyaml>=6.0.3",
    "sympy>=1.14.0",
    "ziamath>=0.13",
    "fonttools>=4.0",
    "qmlmathplot>=0.4.3",
]

[dependency-groups]
dev = [
    "nuitka>=4.2.2",
    "ruff>=0.17.1",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
