# Keyboard configuration for calculator
# Optimized for high school level mathematics

basic:
  title: "Basic"
  grid:
    - ["7", "8", "9", "/", "("]
    - ["4", "5", "6", "*", ")"]
    - ["1", "2", "3", "-", "^"]
    - ["0", ".", "=", "+", "sqrt("]

functions:
  title: "Functions"
  grid:
    - ["sin(", "cos(", "tan("]
    - ["asin(", "acos(", "atan("]
    - ["log(", "ln(", "log10(", "exp("]
    - ["abs(", "sqrt(", "factorial(", "cbrt("]

calculus:
  title: "Calculus"
  grid:
    - ["limit(", "diff(", "integrate(", "Derivative(", "Integral("]
    - ["Limit(", "oo", "zoo", "pi", "E"]
    - ["Sum(", "Product(", "summation(", "", ""]

algebra:
  title: "Algebra"
  grid:
    - ["solve(", "expand(", "factor(", "simplify("]
    - ["collect(", "apart(", "cancel(", "together("]
    - ["roots(", "poly(", "div(", "rem("]
    - ["gcd(", "lcm(", "", ""]

symbols:
  title: "Symbols"
  grid:
    - ["+", "-", "*", "/", "^"]
    - ["=", "<", ">", "<=", ">="]
    - ["(", ")", "|", "pi", "E"]
    - ["deg", "rad", "%", "!", "sqrt("]

constants:
  title: "Constants"
  grid:
    - ["pi", "E", "I", "oo", "zoo"]
    - ["GoldenRatio", "EulerGamma", "Catalan", "inf", "nan"]
