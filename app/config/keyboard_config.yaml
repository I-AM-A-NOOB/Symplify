basic:
    title: "基本"
    grid:
        - - ["()", "(...)"]
          - ["7", "7"]
          - ["8", "8"]
          - ["9", "9"]
          - ["\u007F", "DEL"]
          - ["\u0008", "BAK"]
        - - ["(", "("]
          - ["4", "4"]
          - ["5", "5"]
          - ["6", "6"]
          - ["*", "×"]
          - ["/", "÷"]
        - - [")", ")"]
          - ["1", "1"]
          - ["2", "2"]
          - ["3", "3"]
          - ["+", "+"]
          - ["-", "-"]
        - - text: "const"
            items:
                - - ["pi", "π"]
                  - ["E", "e"]
                - - ["I", "i"]
                  - null
          - ["0", "0"]
          - [".", "."]
          - [",", ","]
          - null
          - ["=", "="]

nine-key:
    title: "九键"
    grid:
        - - ["()", "(...)"]
          - text: "ABC"
            items:
                - - ["A", "A"]
                  - ["a", "a"]
                - - ["B", "B"]
                  - ["b", "b"]
                - - ["C", "C"]
                  - ["c", "c"]
          - text: "DEF"
            items:
                - - ["D", "D"]
                  - ["d", "d"]
                - - ["E", "E"]
                  - ["e", "e"]
                - - ["F", "F"]
                  - ["f", "f"]
        - - text: "GHI"
            items:
                - - ["G", "G"]
                  - ["g", "g"]
                - - ["H", "H"]
                  - ["h", "h"]
                - - ["I", "I"]
                  - ["i", "i"]
          - text: "JKL"
            items:
                - - ["J", "J"]
                  - ["j", "j"]
                - - ["K", "K"]
                  - ["k", "k"]
                - - ["L", "L"]
                  - ["l", "l"]
          - text: "MNO"
            items:
                - - ["M", "M"]
                  - ["m", "m"]
                - - ["N", "N"]
                  - ["n", "n"]
                - - ["O", "O"]
                  - ["o", "o"]
        - - text: "PQRS"
            items:
                - - ["P", "P"]
                  - ["p", "p"]
                - - ["Q", "Q"]
                  - ["q", "q"]
                - - ["R", "R"]
                  - ["r", "r"]
                - - ["S", "S"]
                  - ["s", "s"]
          - text: "TUV"
            items:
                - - ["T", "T"]
                  - ["t", "t"]
                - - ["U", "U"]
                  - ["u", "u"]
                - - ["V", "V"]
                  - ["v", "v"]
          - text: "WXYZ"
            items:
                - - ["W", "W"]
                  - ["w", "w"]
                - - ["X", "X"]
                  - ["x", "x"]
                - - ["Y", "Y"]
                  - ["y", "y"]
                - - ["Z", "Z"]
                  - ["z", "z"]
        - - [",", ","]
          - ["(", "("]
          - [")", ")"]

symbols:
    title: "符号"
    grid:
        - - ["pi", "π"]
          - ["E", "e"]
          - ["i", "i"]
        - - ["oo", "∞"]
          - ["zoo", "-∞"]
          - ["nan", "NaN"]

trig:
    title: "三角函数"
    grid:
        - - ["sin()", "sin"]
          - ["cos()", "cos"]
          - ["tan()", "tan"]
        - - ["asin()", "arcsin"]
          - ["acos()", "arccos"]
          - ["atan()", "arctan"]
        - - ["sinh()", "sinh"]
          - ["cosh()", "cosh"]
          - ["tanh()", "tanh"]

formula:
    title: "多项式"
    grid:
        - - ["solve(, x)", "solve"]
          - ["simplify()", "simplify"]
        - - ["expand()", "expand"]
          - ["factor()", "factor"]

calc:
    title: "微积分"
    grid:
        - - ["summation(f, (i, 1, n))", "Σ"]
          - ["product(f, (i, 1, n))", "Π"]
        - - ["limit(, x, 0)", "lim"]
          - ["diff(, x)", "dy/dx"]
          - ["integrate(, x)", "∫dx"]
