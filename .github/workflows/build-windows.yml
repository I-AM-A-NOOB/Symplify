name: Windows build (Nuitka)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Build with Nuitka
        run: uv run python scripts/build_windows.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: symplify-windows-${{ github.ref_name }}
          path: build/main.dist
          if-no-files-found: error

      # Tagged runs (vX.Y.Z) additionally publish a GitHub Release.
      - name: Package zip
        if: startsWith(github.ref, 'refs/tags/')
        run: powershell Compress-Archive -Path build/main.dist -DestinationPath symplify-${{ github.ref_name }}.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: symplify-${{ github.ref_name }}.zip
          generate_release_notes: true
