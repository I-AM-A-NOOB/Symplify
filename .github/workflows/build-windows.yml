name: Windows build (Nuitka)

# Manual only. The GitHub runner cannot finish this build: v0.5.0's tag run — and
# two attempts after it, with `--low-memory` and then `--jobs=1` — all died in the
# C backend with MSVC's `fatal error C1002` (out of heap), while the same commit
# builds on a dev machine in about four minutes. Those flags took the failures from
# five files to one (`sympy.polys.polyquinticconst`, a 26k-line generated C file)
# and still not through: the runner has less memory, and no Nuitka flag changes
# that. Releases are built locally now (`scripts/build_windows.py` → `Compress-Archive`
# → `gh release create`; 0.5.0 was made that way), so the tag trigger and the
# release steps are gone — with them the `contents: write` permission, which only
# ever existed to publish. Re-add both if the runner ever gets the memory.
on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Build with Nuitka
        run: uv run python scripts/build_windows.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: symplify-windows-${{ github.ref_name }}
          path: build/main.dist
          if-no-files-found: error

