# Keyboard configuration for calculator
# Optimized for high school level mathematics
#
# A key is either a plain string — it shows that text and types it, the common
# case — or a mapping with `label` (what the key shows) and `insert` (what it
# types into the input). Use the mapping where the mathematical glyph differs
# from the name it inserts: `√` shows, `sqrt(` types.

basic:
  title: "Basic"
  grid:
    - ["7", "8", "9", "/", "("]
    - ["4", "5", "6", "*", ")"]
    - ["1", "2", "3", "-", "^"]
    - ["0", ".", "=", "+", { label: "√", insert: "sqrt(" }]

alphabet:
  title: "Alphabet"
  grid:
    - ["q", "w", "e", "r", "t", "y", "u", "i", "o", "p"]
    - ["a", "s", "d", "f", "g", "h", "j", "k", "l"]
    - ["", "z", "x", "c", "v", "b", "n", "m"]

functions:
  title: "Functions"
  grid:
    - ["sin(", "cos(", "tan("]
    - ["asin(", "acos(", "atan("]
    - ["log(", "ln(", "log10(", "exp("]
    - [{ label: "|x|", insert: "abs(" }, { label: "√", insert: "sqrt(" },
       { label: "x!", insert: "factorial(" }, { label: "∛", insert: "cbrt(" }]

calculus:
  title: "Calculus"
  grid:
    - ["limit(", "diff(", "integrate(", "Derivative(", "Integral("]
    - ["Limit(", { label: "∞", insert: "oo" }, { label: "∞", insert: "zoo" },
       { label: "π", insert: "pi" }, { label: "e", insert: "E" }]
    - ["Sum(", "Product(", "summation(", "", ""]

algebra:
  title: "Algebra"
  grid:
    - ["solve(", "expand(", "factor(", "simplify("]
    - ["collect(", "apart(", "cancel(", "together("]
    - ["roots(", "poly(", "div(", "rem("]
    - ["gcd(", "lcm(", "", ""]

symbols:
  title: "Symbols"
  grid:
    - ["+", "-", "*", "/", "^"]
    - ["=", "<", ">", { label: "≤", insert: "<=" }, { label: "≥", insert: ">=" }]
    - ["(", ")", "|", { label: "π", insert: "pi" }, { label: "e", insert: "E" }]
    - ["deg", "rad", "%", "!", { label: "√", insert: "sqrt(" }]

constants:
  title: "Constants"
  grid:
    - [{ label: "π", insert: "pi" }, { label: "e", insert: "E" },
       { label: "i", insert: "I" }, { label: "∞", insert: "oo" },
       { label: "∞", insert: "zoo" }]
    - [{ label: "φ", insert: "GoldenRatio" }, { label: "γ", insert: "EulerGamma" },
       { label: "G", insert: "Catalan" }, { label: "∞", insert: "inf" }, "nan"]
